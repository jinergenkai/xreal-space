# Codemagic CI (codemagic.io) — free 500 build min/month for personal accounts, no card.
# Used instead of GitHub Actions while the GitHub account is billing-locked. APK appears under the build's Artifacts.
workflows:
  android-debug:
    name: Android debug APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    when:
      changeset:
        includes:
          - android/
    scripts:
      - name: Unit tests + build APK
        working_directory: android
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
      - android/app/build/reports/tests/**
