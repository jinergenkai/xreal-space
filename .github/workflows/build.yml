name: android-apk
on:
  push:
    paths: ["android/**", ".github/workflows/build.yml"]
  workflow_dispatch:
# a newer push cancels the build still running for an older one (saves minutes)
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      # ubuntu runners ship the Android SDK at $ANDROID_HOME; no setup action needed
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      # Official release key from repo secrets (optional; without it release is debug-signed)
      - name: Release key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; echo "signing with the release key"; else echo "no release key secret: release APK will be debug-signed"; fi
      - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Publish the signed release APK to the PUBLIC releases repo so phones can self-update.
      # Needs: release key secrets (same signature for every update) + RELEASES_TOKEN (fine-grained PAT, Contents: write
      # on jinergenkai/xreal-space-releases). Without them this step does nothing.
      - name: Publish update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$ANDROID_KEYSTORE_PATH" ]; then echo "skip: RELEASES_TOKEN or release key not set"; exit 0; fi
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts); VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          TAG="v$VN-$VC"
          if gh release view "$TAG" --repo jinergenkai/xreal-space-releases >/dev/null 2>&1; then echo "$TAG already published"; exit 0; fi
          cp app/build/outputs/apk/release/app-release.apk "xreal-space-$VN.apk"
          gh release create "$TAG" "xreal-space-$VN.apk" --repo jinergenkai/xreal-space-releases --title "XREAL Space $VN" --notes "Bản $VN (build $VC). Xem nhật ký trong wiki."
      - uses: actions/upload-artifact@v4
        with:
          name: xreal-space-release-apk
          retention-days: 30
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xreal-space-debug-apk
          retention-days: 7
          path: android/app/build/outputs/apk/debug/*.apk
