name: android-apk
on:
  push:
    paths: ["android/**", ".github/workflows/build.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      # ubuntu runners ship the Android SDK at $ANDROID_HOME; no setup action needed
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: xreal-space-debug-apk
          retention-days: 14
          path: android/app/build/outputs/apk/debug/*.apk
